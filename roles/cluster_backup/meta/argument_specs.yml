---
argument_specs:
  main:
    short_description: Create, verify or stage a Proxmox configuration backup for recovery
    options:
      proxmox_backup_cluster:
        type: str
        required: true
        description: Expected quorate Proxmox cluster name.
      proxmox_backup_node:
        type: str
        required: true
        description: Expected local Proxmox node name.
      proxmox_backup_path:
        type: path
        required: true
        description: Absolute archive path inside a root-only backup directory.
      proxmox_backup_action:
        type: str
        choices: [create, verify, stage_restore]
        default: create
        description: Create or verify the archive, or stage verified files in a private sibling directory.
