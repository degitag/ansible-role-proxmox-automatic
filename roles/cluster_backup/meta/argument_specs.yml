---
argument_specs:
  main:
    short_description: Create or verify a Proxmox configuration backup
    options:
      proxmox_backup_cluster:
        type: str
        required: true
        description: Expected quorate Proxmox cluster name.
      proxmox_backup_node:
        type: str
        required: true
        description: Expected local Proxmox node name.
      proxmox_backup_path:
        type: path
        required: true
        description: Absolute archive path inside a root-only backup directory.
      proxmox_backup_action:
        type: str
        choices: [create, verify]
        default: create
        description: Create or verify the configuration archive.
