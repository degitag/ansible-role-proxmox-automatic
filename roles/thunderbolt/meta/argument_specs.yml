---
argument_specs:
  main:
    short_description: Persist Thunderbolt network identity and activate hotplug support
    options:
      proxmox_thunderbolt_mtu:
        type: int
        default: 9000
        description: MTU for the Thunderbolt interfaces.
      proxmox_thunderbolt_links:
        type: list
        elements: dict
        required: true
        description: Local Thunderbolt controller PCI paths and stable network names.
  fallback:
    short_description: Reconcile Ethernet fallback for the Ceph OpenFabric
    options:
      proxmox_thunderbolt_mtu:
        type: int
        default: 9000
        description: MTU for the Thunderbolt interfaces.
      proxmox_thunderbolt_links:
        type: list
        elements: dict
        required: true
        description: Local Thunderbolt links and remote network addresses.
      proxmox_thunderbolt_source:
        type: str
        required: true
        description: Local Ceph replication IPv6 address.
      proxmox_thunderbolt_fallback_interface:
        type: str
        required: true
        description: Local Ethernet interface connected to the fallback network.
