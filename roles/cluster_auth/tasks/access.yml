---
- name: Read cluster groups, users and ACLs
  ansible.builtin.command:
    argv: >-
      {{ ['pvesh', 'get', '/access/' ~ item, '--output-format', 'json'] +
         (['--full', '1'] if item == 'users' else []) }}
  loop: [groups, users, acl]
  register: _proxmox_auth_access
  check_mode: false
  changed_when: false

- name: Ensure local authorization groups exist
  ansible.builtin.command:
    argv: [pveum, group, add, "{{ item }}"]
  loop: "{{ proxmox_auth_groups | unique }}"
  changed_when: true
  when: item not in (_proxmox_auth_access.results[0].stdout | from_json | map(attribute='groupid'))

- name: Ensure declared Proxmox users exist
  ansible.builtin.command:
    argv: [pveum, user, add, "{{ item }}"]
  loop: "{{ proxmox_auth_users | unique }}"
  changed_when: true
  when: item not in (_proxmox_auth_access.results[1].stdout | from_json | map(attribute='userid'))

- name: Append declared group memberships to each user
  ansible.builtin.command:
    argv: [pveum, user, modify, "{{ item.user }}", --groups, "{{ _missing_groups | join(',') }}", --append, '1']
  loop: "{{ proxmox_auth_memberships }}"
  vars:
    _existing_user: >-
      {{ (_proxmox_auth_access.results[1].stdout | from_json |
          selectattr('userid', 'equalto', item.user) | list | first) | default({}) }}
    _missing_groups: "{{ item.groups | difference(_existing_user.groups | default('') | split(',')) }}"
  when: _missing_groups | length > 0
  changed_when: true

- name: Ensure declared group ACLs exist with the requested inheritance
  ansible.builtin.command:
    argv: [pveum, acl, modify, "{{ item.path }}", --groups, "{{ item.group }}",
           --roles, "{{ item.role }}", --propagate, "{{ item.propagate | default(true) | int | string }}"]
  loop: "{{ proxmox_auth_group_acls }}"
  changed_when: true
  vars:
    _matching_acl: >-
      {{ _proxmox_auth_access.results[2].stdout | from_json |
         selectattr('type', 'equalto', 'group') | selectattr('ugid', 'equalto', item.group) |
         selectattr('path', 'equalto', item.path) | selectattr('roleid', 'equalto', item.role) |
         selectattr('propagate', 'equalto', item.propagate | default(true) | int) | list }}
  when: _matching_acl | length == 0
