---
- name: Validate desired cluster topology
  ansible.builtin.assert:
    that:
      - (_cluster_name | length > 0) == (_cluster_nodes | length > 0)
      - _cluster_nodes | unique | length == _cluster_nodes | length
    fail_msg: Set the expected cluster name and a nonempty list of unique node names together.
  vars:
    _cluster_name: "{{ proxmox_cluster_name | default('') }}"
    _cluster_nodes: "{{ proxmox_cluster_nodes | default([]) }}"

- name: Read local cluster membership
  ansible.builtin.include_tasks: read_status.yml

- name: Report Proxmox cluster status
  ansible.builtin.debug:
    msg:
      cluster: "{{ _proxmox_cluster_summary.name | default('standalone') }}"
      config_version: "{{ _proxmox_cluster_summary.version | default(none) }}"
      quorate: "{{ _proxmox_cluster_summary.quorate | default(false) | bool }}"
      nodes: "{{ _proxmox_cluster_members }}"

- name: Verify exact cluster membership and quorum
  ansible.builtin.assert:
    that:
      - _proxmox_cluster_summary.name | default('') == proxmox_cluster_name
      - _proxmox_cluster_summary.quorate | default(false) | bool
      - _proxmox_cluster_members | map(attribute='name') | sort == proxmox_cluster_nodes | sort
      - _proxmox_cluster_members | selectattr('online', 'equalto', 1) | list | length == proxmox_cluster_nodes | length
    fail_msg: >-
      Local Proxmox cluster state does not match the required name, online membership or quorum.
      See the local status reported above.
  when: proxmox_cluster_name | default('') | length > 0
